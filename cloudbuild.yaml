substitutions:
  _REGION: asia-south1
  _BACKEND_SERVICE: votetrue-backend
  _FRONTEND_SERVICE: votetrue-frontend
  _BACKEND_URL: https://YOUR_BACKEND_URL

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "3"
      - --set-env-vars
      - ENVIRONMENT=production
      - --set-secrets
      - GEMINI_API_KEY=GEMINI_API_KEY:latest

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_BACKEND_URL}
      - -t
      - gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image
      - gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "3000"
      - --memory
      - 512Mi

images:
  - gcr.io/$PROJECT_ID/${_BACKEND_SERVICE}:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/${_FRONTEND_SERVICE}:$COMMIT_SHA
