<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoteTrue — Misinformation firewall for Indian voters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="verify.jsx"></script>
<script type="text/babel" src="ask.jsx"></script>
<script type="text/babel" src="myths.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "cool",
  "density": "comfortable",
  "badge": "chip",
  "showConfidence": true
}/*EDITMODE-END*/;

function App() {
  const [route, setRoute] = React.useState(() => {
    const h = (window.location.hash || "").replace("#", "");
    return ["home", "verify", "ask", "myths"].includes(h) ? h : "home";
  });
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    window.location.hash = route;
    window.scrollTo({ top: 0, behavior: "instant" });
  }, [route]);

  React.useEffect(() => {
    const root = document.documentElement;
    root.dataset.theme = tweaks.theme;
    root.dataset.density = tweaks.density;
    root.dataset.badge = tweaks.badge;
    root.dataset.showConfidence = String(tweaks.showConfidence);
  }, [tweaks]);

  return (
    <>
      <Shell route={route} setRoute={setRoute}>
        {route === "home" && <HomePage setRoute={setRoute} showConfidence={tweaks.showConfidence} />}
        {route === "verify" && <VerifyPage showConfidence={tweaks.showConfidence} />}
        {route === "ask" && <AskPage showConfidence={tweaks.showConfidence} />}
        {route === "myths" && <MythsPage />}
      </Shell>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Visual">
          <TweakRadio
            label="Theme"
            value={tweaks.theme}
            onChange={(v) => setTweak("theme", v)}
            options={[
              { value: "light", label: "Light" },
              { value: "warm", label: "Warm" },
              { value: "cool", label: "Cool" },
            ]}
          />
          <TweakRadio
            label="Density"
            value={tweaks.density}
            onChange={(v) => setTweak("density", v)}
            options={[
              { value: "comfortable", label: "Comfortable" },
              { value: "compact", label: "Compact" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Verdict system">
          <TweakRadio
            label="Badge style"
            value={tweaks.badge}
            onChange={(v) => setTweak("badge", v)}
            options={[
              { value: "chip", label: "Chip" },
              { value: "stamp", label: "Stamp" },
              { value: "text", label: "Text" },
            ]}
          />
          <TweakToggle
            label="Show confidence scores"
            value={tweaks.showConfidence}
            onChange={(v) => setTweak("showConfidence", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
